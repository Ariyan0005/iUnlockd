kind = "web"
previewPath = "/"
title = "iUnlockd"
description = "A phone-unlocking marketplace for IMEI, server, and technician services, with customer accounts and order management."
version = "1.0.0"
id = "artifacts/sales-assistant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23103

[services.development]
run = "pnpm --filter @workspace/sales-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sales-assistant", "run", "build" ]
serve = "static"
publicDir = "artifacts/sales-assistant/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23103"
BASE_PATH = "/"
